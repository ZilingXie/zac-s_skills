<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Training Video Template</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: Inter, "SF Pro Display", Arial, sans-serif; background: #101412; color: #f3f5f2; }
    .slide { position: absolute; inset: 0; display: none; padding: 120px 150px; align-content: center; }
    .slide.active { display: grid; }
    .eyebrow { color: #36ad7b; font-size: 18px; font-weight: 700; text-transform: uppercase; }
    h1 { max-width: 1300px; margin: 20px 0; font-size: 76px; line-height: 1.05; }
    p { max-width: 1100px; color: #c9d0cb; font-size: 30px; line-height: 1.5; }
    .number { position: absolute; top: 50px; right: 80px; color: #29312c; font-size: 90px; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <section class="slide active" data-index="01" data-title="Topic">
      <span class="number">01</span>
      <div class="eyebrow">Training topic</div>
      <h1>Replace this with the literal topic or problem.</h1>
      <p>Use the first page to establish the outcome and scope.</p>
    </section>
    <section class="slide" data-index="02" data-title="Method">
      <span class="number">02</span>
      <div class="eyebrow">Reusable method</div>
      <h1>Evidence, decision, solution, and verification.</h1>
      <p>Keep each page focused on one conclusion supported by readable evidence.</p>
    </section>
  </main>
  <script>
    const slides = [...document.querySelectorAll('.slide')];
    function show(index) {
      slides.forEach((slide, position) => slide.classList.toggle('active', position === index));
      history.replaceState(null, '', `#${index + 1}`);
    }
    const initial = Math.max(0, Number(location.hash.slice(1) || 1) - 1);
    show(initial);
  </script>
</body>
</html>
