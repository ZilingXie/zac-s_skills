[project]
name = "training-video-pipeline"
version = "0.1.0"
description = "Build narrated training videos from HTML slide decks and Markdown transcripts"
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4==4.13.4",
  "moviepy==2.2.1",
  "num2words==0.5.14",
  "pillow==11.3.0",
  "playwright==1.54.0",
  "pydantic==2.11.7",
  "python-dotenv==1.2.2",
  "pyyaml==6.0.2",
]

[project.scripts]
training-video = "training_video.cli:main"

[dependency-groups]
dev = ["pytest==8.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training_video"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
